[project]
name = "ajora-engine"
version = "0.1.0"
description = "Ajora — consent-first multi-bank financial insights for Nigeria. Stateless engine for transfer dedup, communal-finance classification, and grounded explanations."
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
# Run every maintained Python suite from the repo root. The path entries expose
# the engine/API packages plus the backend's historical `app.*` import path.
pythonpath = [".", "backend"]
testpaths = ["engine/tests", "api/tests", "backend/tests"]
addopts = ["--import-mode=importlib"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine"]
