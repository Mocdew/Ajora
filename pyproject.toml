[project]
name = "ajora-engine"
version = "0.1.0"
description = "Ajora — ajo savings circles, contribution tracking, and payout turns, with supporting financial insights."
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.24",
    "scipy>=1.11",
    "rapidfuzz>=3.5",
    "networkx>=3.1",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Live Claude path for the explainer; the offline stub runs without it.
llm = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
# Run both maintained Python suites from the repository root.
pythonpath = ["."]
testpaths = ["engine/tests", "api/tests"]
addopts = ["--import-mode=importlib"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine"]
