</style></head><body><canvas id="stage" width="1080" height="1350" aria-label="Ajora 30-second silent savings circle promo"></canvas>
<script>
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d');
const W=1080,H=1350,PAPER='#f9f7f3',INK='#242321',MUTED='#797670',LINE='#dfdcd5',GREEN='#287852',PALE='#edf3ee';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
const lerp=(a,b,t)=>a+(b-a)*t;
function rgba(hex,a){let c=hex.replace('#','');return `rgba(${parseInt(c.slice(0,2),16)},${parseInt(c.slice(2,4),16)},${parseInt(c.slice(4,6),16)},${a})`}
function mix(a,b,t){let p=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));let aa=p(a),bb=p(b);return '#'+aa.map((v,i)=>Math.round(lerp(v,bb[i],t)).toString(16).padStart(2,'0')).join('')}
function box(x,y,w,h,r=22,fill='white',stroke=LINE,shadow=false){ctx.save();if(shadow){ctx.shadowColor='rgba(36,35,33,.07)';ctx.shadowBlur=40;ctx.shadowOffsetY=20}ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}ctx.shadowColor='transparent';if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}ctx.restore()}
function circle(x,y,r,fill,stroke,lw=1.5){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function line(x1,y1,x2,y2,color=LINE,lw=1.5){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.stroke()}
function text(s,x,y,size=28,color=INK,weight=400,align='left',maxWidth=940,font='Geist'){ctx.save();ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.font=`${weight} ${size}px ${font}`;let m=ctx.measureText(s).width;if(m>maxWidth){size*=maxWidth/m;ctx.font=`${weight} ${size}px ${font}`}ctx.fillText(s,x,y);ctx.restore()}
function mono(s,x,y,size=19,color=MUTED,align='left'){text(s,x,y,size,color,400,align,920,'GeistMono')}
function serif(s,x,y,size=85,color=INK,align='left',maxWidth=940){text(s,x,y,size,color,'italic',align,maxWidth,'Georgia')}
function mark(x,y,size,color=INK,rotation=0){ctx.save();ctx.translate(x,y);ctx.scale(size/32,size/32);ctx.rotate(rotation);circle(16,16,12.5,null,color,1.5);ctx.save();ctx.translate(16,16);ctx.rotate(40*Math.PI/180);ctx.beginPath();ctx.ellipse(0,0,5.5,12.5,0,0,Math.PI*2);ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.stroke();ctx.restore();circle(25,7,3,color);ctx.restore()}
function arrow(x,y,size=24,color=INK){line(x-size*.6,y,x+size*.6,y,color,2);line(x+size*.1,y-size*.45,x+size*.6,y,color,2);line(x+size*.1,y+size*.45,x+size*.6,y,color,2)}
function check(x,y,size=12,color=GREEN){ctx.beginPath();ctx.moveTo(x-size*.65,y);ctx.lineTo(x-size*.12,y+size*.48);ctx.lineTo(x+size*.72,y-size*.5);ctx.strokeStyle=color;ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function person(x,y,r,initial,fill='#eeece6',color=INK){circle(x,y,r,fill,LINE);text(initial,x,y+r*.3,r*.7,color,500,'center')}
function pill(s,x,y,w,color=INK,fill='#eeece6'){box(x,y,w,42,21,fill,null);text(s,x+w/2,y+28,19,color,500,'center',w-18)}
function enter(u,delay,draw){let a=ease((u-delay)/.7);ctx.save();ctx.globalAlpha*=a;ctx.translate(0,30*(1-a));draw(a);ctx.restore()}
function headline(a,b,u,color=INK){enter(u,-.32,()=>text(a,80,300,82,color,500));enter(u,-.2,()=>serif(b,80,397,89,color,'left',920))}
function stageNote(s,y=1182,color=MUTED){text(s,540,y,26,color,400,'center',920)}
function orbit(x,y,r,t,alpha=.2){ctx.save();ctx.translate(x,y);ctx.rotate(t*.08);ctx.strokeStyle=rgba(INK,alpha);ctx.lineWidth=1.4;ctx.setLineDash([3,13]);ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.restore()}
function heading(s,x=126,y=620){mono(s,x,y,18)}
function drawPeople(t,u){
 headline('One circle.','Shared goals.',u);
 const cx=540,cy=815,formed=ease(u/2.7),r=lerp(263,205,formed);
 enter(u,-.3,()=>{
  circle(cx,cy,285,null,rgba(INK,.045));orbit(cx,cy,255,t,.12);circle(cx,cy,r,null,rgba(INK,.16));
  ctx.save();ctx.translate(cx,cy);ctx.rotate(-.42+t*.025);ctx.beginPath();ctx.ellipse(0,0,285,108,0,0,Math.PI*2);ctx.strokeStyle=rgba(INK,.08);ctx.lineWidth=1.4;ctx.stroke();ctx.restore();
  const initials=['T','E','A','C','Z','K'];
  initials.forEach((n,i)=>{let angle=-Math.PI/2+i*Math.PI/3+Math.sin(t*.35)*.035;let px=cx+Math.cos(angle)*r,py=cy+Math.sin(angle)*r;line(cx,cy,px,py,rgba(INK,.09));person(px,py,38,n,PAPER);});
  circle(cx,cy+8,91,rgba(INK,.035));circle(cx,cy,91,PAPER,rgba(INK,.23));mark(cx-36,cy-51,72,INK,t*.015);mono('AJO',cx,cy+49,22,INK,'center');
 });
 stageNote('A familiar way to save. A clearer way to organise.');
}
function drawInvite(t,u){
 headline('Bring your','people together.',u);
 enter(u,.05,()=>{
  const dy=Math.sin(t*.8)*4;ctx.save();ctx.translate(0,dy);
  box(94,536,892,566,30,'#fff',LINE,true);heading('YOUR SAVINGS CIRCLE',138,588);

  line(138,689,942,689);
  mono('CONTRIBUTION',138,738,19);text('₦20,000',138,793,50,INK,400);
  mono('SCHEDULE',635,738,19);text('Monthly',635,793,43,INK,400);
  for(let i=0;i<6;i++){let p=ease((u-.3-i*.13)/.65);ctx.save();ctx.globalAlpha*=p;ctx.translate(0,15*(1-p));person(171+i*75,877,29,['T','E','A','C','Z','K'][i]);ctx.restore()}
  mono('YOUR PEOPLE, ONE PLAN.',138,956,18);
  box(138,990,804,71,35,INK,null);text('Share an invite',540,1036,27,PAPER,500,'center');arrow(882,1026,22,PAPER);
  ctx.restore();
 });
 stageNote('Create a circle. Invite people you trust.');
}
function row(y,name,initial,state,amount='₦20,000',highlight=0){
 if(highlight>0){ctx.save();ctx.globalAlpha*=highlight;box(119,y-47,842,101,16,PALE,null);ctx.restore()}

 if(state==='Confirmed'){pill(state,655,y-20,230,GREEN,PALE);check(918,y+1,12,GREEN)}else{pill(state,695,y-20,230,MUTED,'#f0eee8')}
}
function drawContributions(t,u){
 headline('Every contribution.','Clearly recorded.',u);
 enter(u,.05,()=>{
  box(94,536,892,566,30,'#fff',LINE,true);heading('FRIENDS & GOALS',138,588);text('Contribution records',138,648,43,INK,500);pill('ROUND 2',774,614,154);
  line(138,689,942,689);

 text('Submit your reference. Your organiser reviews it.',540,1212,23,MUTED,400,'center',920);
}
function drawTurns(t,u){
 headline('Know whose','turn is next.',u);

function drawOverview(t,u){

 const C=PAPER;
