# Ajora demo stack — API (FastAPI + engine) + web (Next.js dashboard).
# On a machine with Docker:  docker compose up --build
# Then open http://<host>:3000  (demo persona: Emeka Balogun / u_persona_b).
#
# Circle records and trust-layer state live in the api-state volume.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ajora-api
    ports:
      - "8000:8000"
    environment:
      AJORA_STATE_DIR: /data
      AJORA_AUTH_ORIGINS: "${AJORA_AUTH_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      AJORA_COOKIE_SECURE: "${AJORA_COOKIE_SECURE:-false}"
      AJORA_RESEND_API_KEY: "${AJORA_RESEND_API_KEY:-}"
      AJORA_EMAIL_FROM: "${AJORA_EMAIL_FROM:-}"
      AJORA_PUBLIC_WEB_URL: "${AJORA_PUBLIC_WEB_URL:-http://localhost:3000}"
      AJORA_GOOGLE_CLIENT_ID: "${AJORA_GOOGLE_CLIENT_ID:-}"
    volumes:
      - api-state:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Next freezes rewrites at build time, so the proxy target must be a build arg.
        AJORA_API_BASE: "http://api:8000"
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: "${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}"
    image: ajora-web
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-state:
